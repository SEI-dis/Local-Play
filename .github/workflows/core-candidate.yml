# SPDX-License-Identifier: AGPL-3.0-or-later
name: Check upstream core update
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional exact rom64 commit (empty: current branch head)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: core-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned build tools
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git init work/emsdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C work/emsdk fetch --depth=1 https://github.com/emscripten-core/emsdk.git b44154299bdefe75ba287874bb63fc9806243771
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C work/emsdk checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python work/emsdk/emsdk.py install 4.0.15
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python work/emsdk/emsdk.py activate 4.0.15
      - name: Build and check a separate candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          $candidateArgs = @('-B', '-X', 'utf8', 'web/scripts/core-candidate.py', '--emsdk', 'work/emsdk')
          if ($env:CANDIDATE_COMMIT) { $candidateArgs += @('--commit', $env:CANDIDATE_COMMIT) }
          python @candidateArgs
      # Candidate binaries and full upstream trees are NEVER uploaded: a license
      # change could require a new decision before any public redistribution.
      - name: Keep the review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-update-review
          path: work/core-candidates/latest-report.json
          if-no-files-found: ignore
          retention-days: 14
